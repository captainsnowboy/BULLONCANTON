    <script>
      // Prevent browser extension injection conflicts (e.g. multiple crypto wallet extensions redefining window.ethereum)
      (function() {
        try {
          let _eth = window.ethereum;
          Object.defineProperty(window, 'ethereum', {
            configurable: true,
            enumerable: true,
            get: function() { return _eth; },
            set: function(val) { _eth = val; }
          });
        } catch (_) {}

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot redefine property: ethereum') !== -1) ||
            (e.error && e.error.stack && e.error.stack.indexOf('chrome-extension://') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (
            (e.reason && e.reason.stack && e.reason.stack.indexOf('chrome-extension://') !== -1) ||
            (e.reason && e.reason.message && e.reason.message.indexOf('Cannot redefine property: ethereum') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
